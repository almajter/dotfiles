#~/.tmux.conf

# ── Prefix Key ──────────────────────────────────────
# prefix: C-a (C-a C-a sends a literal C-a through to the shell)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Mouse Support ───────────────────────────────────
# Normal scrolling, clicking, resizing
set -g mouse on

# ── Scrollback ──────────────────────────────────────
set -g history-limit 50000

# ── Copy Mode (Vi style) ───────────────────────────
# y and mouse-drag-to-copy come from tmux-yank (see Plugins); it does not bind
# v, and tmux's default puts rectangle-toggle on v, so rebind vim-style here.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Terminal Capabilities ──────────────────────────
# Truecolor and clickable links.
# Assigned, not `-a` appended: these are array options, and appending would add
# a duplicate entry on every `prefix + r` reload. Targets `*` because the outer
# terminal reports TERM=alacritty, which `xterm*` does not match.
set -g default-terminal "tmux-256color"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,*:RGB:hyperlinks:extkeys"

# Extended keys, so Shift+Enter reaches Claude Code as ESC[13;2u (paired with
# the binding in alacritty.toml). It can't be sent as "\n": that's 0x0a == C-j,
# which vim-tmux-navigator grabs for select-pane -D. `always` because `on` only
# forwards to apps that ask, collapsing S-Enter to a bare CR; `csi-u` because
# the default xterm format sends ESC[27;2;13~. Ordinary keys are unaffected.
set -s extended-keys always
set -s extended-keys-format csi-u

# ── Quality of Life ────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Reload Config ───────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split with | and -  (much more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in same directory
bind c new-window -c "#{pane_current_path}"

# Swap window positions
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Quick session switching
bind s choose-tree -sZ     # visual session picker (prefix + s)
bind S new-session          # create new session

# Session picker on a single keypress, no prefix. AeroSpace deliberately
# leaves alt-s unbound (see aerospace.toml) so plain Alt-s reaches tmux.
bind-key -n M-s choose-tree -sZ

# Navigate panes with h, j, k, l (-r = repeatable without re-pressing prefix)
bind -r h select-pane -L    # ← left
bind -r j select-pane -D    # ↓ down
bind -r k select-pane -U    # ↑ up
bind -r l select-pane -R    # → right

# Prefix-less, vim-aware C-h/j/k/l pane nav comes from vim-tmux-navigator.

# Resize panes with Ctrl+Alt+h/j/k/l, no prefix needed (-n). Plain Alt keys
# belong to AeroSpace (window manager); Ctrl-Alt is free everywhere.
bind -n C-M-h resize-pane -L 2
bind -n C-M-j resize-pane -D 2
bind -n C-M-k resize-pane -U 2
bind -n C-M-l resize-pane -R 2

# ── Pane Borders ────────────────────────────────────
# Accent border on the active pane; border line shows pane index + command.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top

# Panes inherit the terminal's own colors. Set explicitly rather than left
# unset, to stop tmux-resurrect restoring stale bg colors on session restore.
# (Dimming inactive panes was tried twice and doesn't work -- see README.md,
# "Gotchas". README lives on the main branch only.)
set -g window-style default
set -g window-active-style default

# ── Status Bar ──────────────────────────────────────
# Catppuccin Mocha palette. Colour blocks only, no powerline glyphs -- the
# terminal font is Menlo (no Nerd Font installed), which has no  separators.
set -g status-position top          # bar on top instead of bottom
set -g status-interval 5            # refresh every 5 seconds
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Session badge: blue block, flips to peach while the prefix is armed, so it's
# obvious when tmux is waiting for the second half of a key sequence.
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#{?client_prefix,#fab387,#89b4fa},bold] #S #[fg=#{?client_prefix,#fab387,#89b4fa},bg=#1e1e2e,nobold] "

# Window tabs: active tab is a filled mauve block, inactive ones stay muted.
set -g window-status-separator ""
set -g window-status-format "#[fg=#7f849c,bg=#1e1e2e] #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-activity-style "fg=#f9e2af,bg=#1e1e2e"
set -g window-status-bell-style "fg=#f38ba8,bg=#1e1e2e,bold"

# Right side: time and date. tmux-continuum prepends its autosave hook here at
# plugin load (guarded against duplicates), which is why this is set before TPM.
set -g status-right-length 80
set -g status-right "#[fg=#cdd6f4]%I:%M %p #[fg=#45475a]│#[fg=#a6adc8] %b %d "

# ── Plugins (TPM) ───────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'

# Auto-save session state every 15 min and restore it on tmux start
set -g @continuum-restore 'on'

# Initialize TPM (must be at the very bottom of the config)
run '~/.tmux/plugins/tpm/tpm'
